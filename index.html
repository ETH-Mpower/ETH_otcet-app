        .worker-row-box select { flex: 2; margin: 0; }
        .worker-row-box input { flex: 1; margin: 0; text-align: center; }
        button { background-color: #1f497d; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; transition: background 0.2s; }

        button.add-btn { background-color: #28a745; margin-top: 5px; padding: 8px; font-size: 14px; margin-bottom: 15px; }
        button.add-btn:active { background-color: #1e7e34; }
        button.del-btn { background-color: #dc3545; padding: 12px; width: auto; font-size: 14px; margin-bottom: 10px; }
        .offline-badge { background-color: #ff9800; color: white; text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; font-size: 13px; margin-bottom: 15px; display: none; }
